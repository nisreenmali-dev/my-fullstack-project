name: Build, Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        shell: bash
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_PAT,IMAGE_PREFIX
          script: |
            set -e
            IMAGE_PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"

            echo "$GHCR_PAT" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            docker pull "${IMAGE_PREFIX}-frontend:latest"
            docker pull "${IMAGE_PREFIX}-backend:latest"

            docker network create app-net 2>/dev/null || true

            docker rm -f app-backend app-frontend 2>/dev/null || true

            # Change 5001 to the backend's actual container port.
            docker run -d --name app-backend \
              --restart unless-stopped --network app-net \
              -p 5001:5001 \
              "${IMAGE_PREFIX}-backend:latest"

            # Assumes the frontend container serves HTTP on port 80.
            docker run -d --name app-frontend \
              --restart unless-stopped --network app-net \
              -p 80:80 \
              "${IMAGE_PREFIX}-frontend:latest"

            docker image prune -f
